on: [push, pull_request]

name: cwtools

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Set chmod
      run: chmod +x ./build.sh
    - name: Test
      run: /bin/sh ./build.sh Test
